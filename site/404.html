<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Historia Nova</title>
    <!-- Same compass favicon as the landing page (assemble-site copies site/ to the
         root, so /favicon.png resolves here too). -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111113" />

    <!-- This file is why unknown URLs return a real 404. Cloudflare Pages serves
         /404.html with a 404 status when a path matches no asset; with no such file
         it falls back to /index.html with a 200, so every typo, dead link and stale
         search result answered as the landing page. Search engines read that as a
         "soft 404" and it made a broken sitemap URL indistinguishable from a working
         one. Deleting this file silently restores that behaviour. -->
    <meta name="robots" content="noindex" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    />

    <style>
      :root {
        --parch: #111113;
        --marble: #1a1a1f;
        --marble2: #212128;
        --ink: #ece4d2;
        --sepia: #a4987f;
        --line: rgba(233, 220, 192, 0.14);
        --line2: rgba(233, 220, 192, 0.26);
        --bronze: #c9932f;
        --gold-l: #dcb954;
        --red-d: #7a1e2b;
        --grad-gold: linear-gradient(100deg, #a7761f 0%, #e0b44a 52%, #b98f2e 100%);
        --serif: "EB Garamond", Georgia, "Times New Roman", serif;
        --display: "Cinzel", Georgia, "Times New Roman", serif;
      }
      * { box-sizing: border-box; }
      html {
        /* Same fluid root size as the landing page, so a visitor arriving here
           from a dead link doesn't see the type change scale */
        font-size: clamp(1rem, 0.536vw + 0.51812rem, 1.5rem);
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 1.125rem;
        line-height: 1.62;
        text-align: center;
        -webkit-font-smoothing: antialiased;
        background:
          radial-gradient(75rem 33.75rem at 50% -12%, rgba(201, 147, 47, 0.14), transparent 60%),
          radial-gradient(62.5rem 35rem at 100% 2%, rgba(168, 57, 74, 0.08), transparent 55%),
          repeating-linear-gradient(112deg, rgba(233, 220, 192, 0.02) 0 0.125rem, transparent 0.125rem 0.4375rem),
          var(--parch);
      }
      .wrap { max-width: 35rem; }
      /* The project icon, matching the landing page's brand mark rather than
         the system emoji it replaced there. */
      .mark {
        width: 4rem;
        height: 4rem;
        display: block;
        margin: 0 auto 1.25rem;
        border-radius: 0.75rem;
        object-fit: contain;
      }
      h1 {
        font-family: var(--display);
        font-size: clamp(2.2rem, 8vw, 3.4rem);
        margin: 0 0 0.375rem;
        letter-spacing: 0.02em;
        font-weight: 800;
        color: var(--ink);
      }
      .eyebrow {
        font-family: var(--display);
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--bronze);
        margin-bottom: 1.125rem;
      }
      p { color: var(--sepia); margin: 0 auto 1.625rem; }
      .rule {
        width: 7.5rem;
        height: 0.125rem;
        margin: 1.375rem auto;
        background: linear-gradient(90deg, transparent, var(--bronze), transparent);
      }
      .btns { display: flex; gap: 0.875rem; justify-content: center; flex-wrap: wrap; }
      .btn {
        font-family: var(--display);
        font-size: 0.94rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 0.9375rem 1.75rem;
        border-radius: 0.6875rem;
        border: 1px solid var(--line2);
        background: var(--marble);
        color: var(--ink);
        transition: transform 0.12s ease, box-shadow 0.2s, background 0.2s;
      }
      .btn:hover { transform: translateY(-0.125rem); background: var(--marble2); }
      .btn:focus-visible { outline: 2px solid var(--gold-l); outline-offset: 3px; }
      /* crimson, not gold: the landing page spends gold on section rules and
         accents, and reserves this gradient for the one action it wants taken */
      .btn-primary {
        background: linear-gradient(180deg, #98283a, var(--red-d));
        color: #f7eccf;
        border-color: rgba(255, 222, 160, 0.4);
        box-shadow: 0 0.75rem 1.875rem -0.75rem rgba(0, 0, 0, 0.8);
      }
      .btn-primary:hover { background: linear-gradient(180deg, #a12b3e, #7a1e2b); }
      @media (prefers-reduced-motion: reduce) {
        .btn { transition: none; }
        .btn:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <img class="mark" src="/play/icon-192.png" alt="" width="64" height="64" />
      <div class="eyebrow">Error 404</div>
      <h1>Lost to history</h1>
      <div class="rule"></div>
      <p>
        This page doesn't exist — or it did once, and the borders have moved since.
        Check the address, or start again from somewhere solid.
      </p>
      <div class="btns">
        <a class="btn btn-primary" href="/">Return home</a>
        <a class="btn" href="/play/">Play</a>
        <a class="btn" href="/guides/">Guides</a>
      </div>
    </main>
  </body>
</html>
